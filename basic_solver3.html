<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku – Hint helper</title>
  <style>
    :root{
      --bg:#0f172a; --panel:#111827; --panel2:#0b1220; --text:#e5e7eb; --muted:#94a3b8;
      --line:rgba(148,163,184,.22); --strong:#334155; --accent:#7c3aed; --accent2:#22c55e;
      --cell:#0b1020; --cellFocus:#111827; --hint:#16a34a; --danger:#ef4444;
      --shadow:0 20px 60px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center; color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124,58,237,.22), transparent 28%),
        radial-gradient(circle at bottom right, rgba(34,197,94,.16), transparent 26%),
        linear-gradient(180deg, #0b1020, var(--bg));
      padding:24px;
    }
    .app{
      width:min(100%, 760px); background:rgba(17,24,39,.82); backdrop-filter:blur(16px);
      border:1px solid rgba(148,163,184,.14); border-radius:24px; box-shadow:var(--shadow);
      padding:24px;
    }
    .top{
      display:flex; gap:16px; justify-content:space-between; align-items:end; flex-wrap:wrap;
      margin-bottom:18px
    }
    h2{margin:0; font-size:clamp(1.4rem,3vw,2rem); letter-spacing:-.02em}
    .sub{color:var(--muted); margin:6px 0 0; font-size:.95rem}
    .actions{display:flex; gap:12px; flex-wrap:wrap}
    button{
      border:0; cursor:pointer; border-radius:14px; padding:12px 16px; font-weight:700; color:white;
      background:linear-gradient(135deg, var(--accent), #2563eb); box-shadow:0 10px 25px rgba(124,58,237,.25);
      transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
    }
    button:hover{transform:translateY(-1px); filter:brightness(1.06); box-shadow:0 14px 30px rgba(124,58,237,.32)}
    button.secondary{background:linear-gradient(135deg, #334155, #1f2937); box-shadow:none}
    .play-area{
      display:flex;
      gap:18px;
      align-items:flex-start;
      flex-wrap:wrap;
    }
    .board-wrap{
      flex:0 0 auto;
      overflow:auto;
      padding:8px 0 2px;
    }
    .side-panel{
      flex:1 1 220px;
      min-width:220px;
    }
    .side-panel .status{
      margin-top:0;
    }
    table{border-collapse:collapse; margin:0 auto; background:var(--panel2); border:2px solid var(--strong); border-radius:18px; overflow:hidden}
    td{border:1px solid var(--line); width:clamp(34px, 6vw, 52px); height:clamp(34px, 6vw, 52px); padding:0; background:rgba(15,23,42,.55)}
    input{
      width:100%; height:100%; border:0; outline:0; background:transparent; color:var(--text);
      font-size:clamp(1rem, 2.3vw, 1.35rem); text-align:center; font-weight:700; caret-color:var(--accent2);
    }
	
	.number-bar,
	.bottom-actions {
	  display: flex;
	  flex-wrap: wrap;
	  gap: 10px;
	  margin: 20px 10px 20px;
	}

    input:focus{background:var(--cellFocus); box-shadow:inset 0 0 0 2px rgba(124,58,237,.35)}
    tr:nth-child(3n) td{border-bottom:2px solid var(--strong)}
    td:nth-child(3n){border-right:2px solid var(--strong)}
    tr:first-child td{border-top:0}
    td:first-child{border-left:0}
    .hint-cell{background:rgba(34,197,94,.28) !important; box-shadow:inset 0 0 0 2px rgba(34,197,94,.55)}
    .status{
      margin:16px 2px 0; min-height:1.5em; color:var(--muted); font-size:.98rem; line-height:1.4;
      padding:12px 14px; border:1px solid rgba(148,163,184,.12); border-radius:14px; background:rgba(2,6,23,.35)
    }
    .counts-wrap{
      margin-top:14px;
      overflow-x:auto;
    }
    .counts-table{
      width:100%;
      border-collapse:collapse;
      background:rgba(2,6,23,.28);
      border:1px solid rgba(148,163,184,.12);
      border-radius:14px;
      overflow:hidden;
    }
    .counts-table th,
    .counts-table td{
      padding:10px 12px;
      text-align:left;
      border-bottom:1px solid rgba(148,163,184,.10);
    }
    .counts-table th{
      color:var(--muted);
      font-weight:700;
    }
    .counts-table td:last-child,
    .counts-table th:last-child{
      text-align:right;
    }
    .counts-table tr:last-child td{
      border-bottom:0;
    }
    .legend{margin-top:14px; color:var(--muted); font-size:.92rem; display:flex; gap:14px; flex-wrap:wrap}
    .pill{padding:6px 10px; border-radius:999px; background:rgba(148,163,184,.12)}
    @media (max-width:720px){
      .play-area{
        flex-direction:column;
      }
      .side-panel{
        width:100%;
        min-width:0;
      }
    }
    @media (max-width:560px){
      .app{padding:16px; border-radius:20px}
      .actions{width:100%}
      button{flex:1}
    }
    .upload-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      padding:12px 16px;
      font-weight:700;
      color:white;
      background:linear-gradient(135deg, #334155, #1f2937);
      cursor:pointer;
      user-select:none;
      transition:transform .15s ease, filter .15s ease;
    }
    .upload-btn:hover{transform:translateY(-1px); filter:brightness(1.06)}
    .upload-btn input{display:none}
  </style>
</head>

<script>
  //base
  let isListenerBlocked = false;

  const inputs = [...document.querySelectorAll('#sudoku input')];
  
  //autofill
  const autoFillNumberButtons = document.querySelectorAll('.number-bar button')
  const autoFillNumber = document.querySelector('#autoFillNumber');
  let autofill_current_number = '1';

  function updateCounts() {
    const counts = Array(10).fill(0);
    inputs.forEach(i => {
      const v = i.value.trim();
      if (/^[1-9]$/.test(v)) counts[parseInt(v, 10)]++;
    });
    for (let n = 1; n <= 9; n++) {
      const el = document.getElementById(`count-${n}`);
      if (el) el.textContent = counts[n];
    }
  }
  
  function moveToRightInGrid(i) {
    isListenerBlocked = true;
    inputs[Math.min(i+1, inputs.length-1)].focus();
	isListenerBlocked = false;
  }

  inputs.forEach((el, i) => {
    el.addEventListener('input', () => {
      el.value = el.value.replace(/[^1-9]/g, '').slice(0,1);
      updateCounts();
	  //skok na dalsi element(bud doprava alebo dolu)
	  console.log( "Skok na dalsi element, index teraz", i );
	  moveToRightInGrid( i );
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') moveToRightInGrid(i);
      if (e.key === 'ArrowLeft') inputs[Math.max(i-1, 0)].focus();
      if (e.key === 'ArrowDown') document.getElementById(`c-${Math.min(8, (+el.id.split('-')[1]||0)+1)}-${el.id.split('-')[2]}`).focus();
      if (e.key === 'ArrowUp') document.getElementById(`c-${Math.max(0, (+el.id.split('-')[1]||0)-1)}-${el.id.split('-')[2]}`).focus();
    });
	
	//focus
	el.addEventListener("focus", function() {

		if ( !isListenerBlocked ) {
			if ( autoFillNumber.checked ) {
				//console.log("Focused element:", el);
				el.value = autofill_current_number;
				updateCounts();
			};
		};
	});
  });
  
  //autofill
  function toggle_number_color_in_grid( number_to_toggle, is_red ) {
	  const sudokuTable = document.getElementById('sudoku');
	  if (!sudokuTable) return;

	  const inputs = sudokuTable.querySelectorAll('input');
	  inputs.forEach(input => {
	    if ( input.value === number_to_toggle ) {
			input.style.color = ( is_red ? 'red' : 'white' );
		}
	  });
  };

  autoFillNumberButtons.forEach((el, i) => {
    el.addEventListener('click', () => {
	  //console.log( "Clicked auto fill number button:", el );
	  autofill_current_number = el.textContent;
	  el.style.color = ( el.style.color == 'red' ? 'white' : 'red' );
	  
	  //nafarbickujeme aktualne cislo, ak uz nafarbickovane je tak nafarbickovanie zrusime
	  toggle_number_color_in_grid( autofill_current_number, el.style.color == 'red' );
	});
  });

  function getGrid() {
    const grid = [];
    for (let r = 0; r < 9; r++) {
      grid[r] = [];
      for (let c = 0; c < 9; c++) {
        const val = document.getElementById(`c-${r}-${c}`).value;
        const n = parseInt(val, 10);
        if (n < 1 || n > 9) {
          grid[r][c] = null;
        } else {
          grid[r][c] = n;
        }
      }
    }
    return grid;
  }

  function getCandidates(grid, r, c) {
    if ( !Number.isNaN(grid[r][c])) return [];
    const forbidden = new Set();
    for (let cc = 0; cc < 9; cc++) if ( !Number.isNaN(grid[r][cc])) forbidden.add(grid[r][cc]);
    for (let rr = 0; rr < 9; rr++) if ( !Number.isNaN(grid[rr][c] )) forbidden.add(grid[rr][c]);
    const br = Math.floor(r / 3) * 3, bc = Math.floor(c / 3) * 3;
    for (let rr = br; rr < br + 3; rr++) for (let cc = bc; cc < bc + 3; cc++) if (grid[rr][cc] !== null) forbidden.add(grid[rr][cc]);
    return [1,2,3,4,5,6,7,8,9].filter(n => !forbidden.has(n));
  }

  function applyNakedSingle() {
    const grid = getGrid();
    for (let r = 0; r < 9; r++) {
	  console.log( "1. Naked single candidate check riadok", r);
      for (let c = 0; c < 9; c++) {
		console.log( "Ideme stlpec: %d hodnota v bunke teraz %d",c, grid[r][c] );
        if ( Number.isNaN( grid[r][c] ) ) {

          const cand = getCandidates(grid, r, c);
		  console.log( "2. Naked single candidate"); // row = %d, column = %d is %d", r, c, cand.length );
          if (cand.length === 1) {
            const cell = document.getElementById(`c-${r}-${c}`);
            cell.value = cand[0];
            cell.classList.add('hint-cell');
            setTimeout(() => cell.classList.remove('hint-cell'), 1800);
            document.getElementById('status').textContent = `Nájdený Naked Single v bunke (${r + 1}, ${c + 1}) = ${cand[0]}`;
            updateCounts();
            return true;
          }
        }
      }
    }
    document.getElementById('status').textContent = 'Žiadny Naked Single sa nenašiel.';
    return false;
  }

  function clearGrid() {
    inputs.forEach(i => i.value = '');
    updateCounts();
    document.getElementById('status').textContent = 'Mriežka bola vymazaná.';
  }

  document.getElementById('hintBtn').addEventListener('click', applyNakedSingle);
  document.getElementById('checkBtn').addEventListener('click', checkSudoku);
  document.getElementById('clearBtn').addEventListener('click', clearGrid);
  
  function setGridFromArray(data) {
    if (!Array.isArray(data) || data.length !== 9) {
      document.getElementById('status').textContent = 'Neplatný JSON: očakávam 9 riadkov.';
      return false;
    }

    for (let r = 0; r < 9; r++) {
      if (!Array.isArray(data[r]) || data[r].length !== 9) {
        document.getElementById('status').textContent = `Neplatný JSON: riadok ${r + 1} nemá 9 hodnôt.`;
        return false;
      }
      for (let c = 0; c < 9; c++) {
        const v = data[r][c];
        const cell = document.getElementById(`c-${r}-${c}`);
        if (v === null || v === "" || v === 0) {
          cell.value = '';
        } else if (Number.isInteger(v) && v >= 1 && v <= 9) {
          cell.value = String(v);
        } else {
          document.getElementById('status').textContent = `Neplatná hodnota na pozícii (${r + 1}, ${c + 1}).`;
          return false;
        }
        cell.classList.remove('hint-cell');
      }
    }

    updateCounts();
    document.getElementById('status').textContent = 'JSON úspešne načítaný.';
    return true;
  }

  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) {
	
	  console.error( "Subor sa nepodarilo nacitat, asi blocked by browser alebo system!" );
	  log_status( "Súbor sa nepodarilo načítať, asi blocked by browser alebo system!", true );
	  return;
	};

    try {
      const text = await file.text();
      const json = JSON.parse(text);
      setGridFromArray(json);
    } catch (err) {
      document.getElementById('status').textContent = 'Nepodarilo sa načítať JSON súbor.';
    }

    e.target.value = '';
  });

  function isUnitValid(unit) {
    const seen = new Set();
    for (const v of unit) {
      if (v === null || Number.isNaN(v)) continue;
      if (v < 1 || v > 9) return false;
      if (seen.has(v)) return false;
      seen.add(v);
    }
    return true;
  }

  function isSudokuValid(grid) {
    for (let r = 0; r < 9; r++) {
      if (!isUnitValid(grid[r])) {
		
		console.log("Chybny grid unit",  grid[r] );
		return { ok: false, where: `Riadok ${r + 1}` };
	  }
    }

    for (let c = 0; c < 9; c++) {
      const col = [];
      for (let r = 0; r < 9; r++) col.push(grid[r][c]);
      if (!isUnitValid(col)) return { ok: false, where: `Stĺpec ${c + 1}` };
    }

    for (let br = 0; br < 3; br++) {
      for (let bc = 0; bc < 3; bc++) {
        const block = [];
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            block.push(grid[3 * br + r][3 * bc + c]);
          }
        }
        if (!isUnitValid(block)) {
          const idx = 3 * br + bc + 1;
          return { ok: false, where: `Štvorec 3x3 ${idx}` };
        }
      }
    }

    return { ok: true, where: null };
  }

  function checkSudoku() {
    const grid = getGrid();
    const res = isSudokuValid(grid);
    const status = document.getElementById('status');

    if (res.ok) {
      status.textContent = 'Sudoku je zatiaľ validné (žiadne konflikty).';
      status.style.color = 'var(--accent2)';
    } else {
      status.textContent = `Konflikt: ${res.where} nie je validný!`;
      status.style.color = 'var(--danger)';
	  console.log("Chybne grid elementy vsetky: ", grid);
    }
    updateCounts();
  }
  
  function log_status( status_log_text, is_error ) {
    const status = document.getElementById('status');
	status.textContent = status_log_text;
    status.style.color = (is_error ? 'var(--danger)' : 'var(--accent2)');
  }

  updateCounts();
</script>
</body>
</html>
