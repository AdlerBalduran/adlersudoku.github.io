<html lang="sk">

  <title>Sudoku – Hint helper</title>
  <style>
    :root{
      --bg:#0f172a; --panel:#111827; --panel2:#0b1220; --text:#e5e7eb; --muted:#94a3b8;
      --line:rgba(148,163,184,.22); --strong:#334155; --accent:#7c3aed; --accent2:#22c55e;
      --cell:#0b1020; --cellFocus:#111827; --hint:#16a34a; --danger:#ef4444;
      --shadow:0 20px 60px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center; color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124,58,237,.22), transparent 28%),
        radial-gradient(circle at bottom right, rgba(34,197,94,.16), transparent 26%),
        linear-gradient(180deg, #0b1020, var(--bg));
      padding:24px;
    }
    .app{
      width:min(100%, 760px); background:rgba(17,24,39,.82); backdrop-filter:blur(16px);
      border:1px solid rgba(148,163,184,.14); border-radius:24px; box-shadow:var(--shadow);
      padding:24px;
    }
    .top{display:flex; gap:16px; justify-content:space-between; align-items:end; flex-wrap:wrap; margin-bottom:18px}
    h2{margin:0; font-size:clamp(1.4rem,3vw,2rem); letter-spacing:-.02em}
    .sub{color:var(--muted); margin:6px 0 0; font-size:.95rem}
    .actions{display:flex; gap:12px; flex-wrap:wrap}
    button{
      border:0; cursor:pointer; border-radius:14px; padding:12px 16px; font-weight:700; color:white;
      background:linear-gradient(135deg, var(--accent), #2563eb); box-shadow:0 10px 25px rgba(124,58,237,.25);
      transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
    }
    button:hover{transform:translateY(-1px); filter:brightness(1.06); box-shadow:0 14px 30px rgba(124,58,237,.32)}
    button.secondary{background:linear-gradient(135deg, #334155, #1f2937); box-shadow:none}
    .board-wrap{overflow:auto; padding:8px 0 2px}
    table{border-collapse:collapse; margin:0 auto; background:var(--panel2); border:2px solid var(--strong); border-radius:18px; overflow:hidden}
    td{border:1px solid var(--line); width:clamp(34px, 6vw, 52px); height:clamp(34px, 6vw, 52px); padding:0; background:rgba(15,23,42,.55)}
    input{
      width:100%; height:100%; border:0; outline:0; background:transparent; color:var(--text);
      font-size:clamp(1rem, 2.3vw, 1.35rem); text-align:center; font-weight:700; caret-color:var(--accent2);
    }
    input:focus{background:var(--cellFocus); box-shadow:inset 0 0 0 2px rgba(124,58,237,.35)}
    tr:nth-child(3n) td{border-bottom:2px solid var(--strong)}
    td:nth-child(3n){border-right:2px solid var(--strong)}
    tr:first-child td{border-top:0}
    td:first-child{border-left:0}
    .hint-cell{background:rgba(34,197,94,.28) !important; box-shadow:inset 0 0 0 2px rgba(34,197,94,.55)}
    .status{
      margin:16px 2px 0; min-height:1.5em; color:var(--muted); font-size:.98rem; line-height:1.4;
      padding:12px 14px; border:1px solid rgba(148,163,184,.12); border-radius:14px; background:rgba(2,6,23,.35)
    }
    .legend{margin-top:14px; color:var(--muted); font-size:.92rem; display:flex; gap:14px; flex-wrap:wrap}
    .pill{padding:6px 10px; border-radius:999px; background:rgba(148,163,184,.12)}
    @media (max-width:560px){.app{padding:16px; border-radius:20px}.actions{width:100%} button{flex:1}}
	.upload-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  padding:12px 16px;
  font-weight:700;
  color:white;
  background:linear-gradient(135deg, #334155, #1f2937);
  cursor:pointer;
  user-select:none;
  transition:transform .15s ease, filter .15s ease;
}
.upload-btn:hover{transform:translateY(-1px); filter:brightness(1.06)}
.upload-btn input{display:none}
  </style>
</head>

    <p id="status" class="status">Zadaj čísla a klikni na Hint.</p>
    <div class="legend">
      <span class="pill">3x3 bloky sú zvýraznené hrubšou čiarou</span>
      <span class="pill">Zelené pole = nájdený Naked Single</span>

<script>
  const inputs = [...document.querySelectorAll('input')];
  inputs.forEach((el, i) => {
    el.addEventListener('input', () => {
      el.value = el.value.replace(/[^1-9]/g, '').slice(0,1);
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') inputs[Math.min(i+1, inputs.length-1)].focus();
      if (e.key === 'ArrowLeft') inputs[Math.max(i-1, 0)].focus();
      if (e.key === 'ArrowDown') document.getElementById(`c-${Math.min(8, (+el.id.split('-')[1]||0)+1)}-${el.id.split('-')[2]}`).focus();
      if (e.key === 'ArrowUp') document.getElementById(`c-${Math.max(0, (+el.id.split('-')[1]||0)-1)}-${el.id.split('-')[2]}`).focus();
    });
  });

  function getGrid() {
    const grid = [];
    for (let r = 0; r < 9; r++) {
      grid[r] = [];
      for (let c = 0; c < 9; c++) {
        const val = document.getElementById(`c-${r}-${c}`).value;
        const n = parseInt(val, 10);
		if ( n < 1 && n > 9 ) {
			console.log( "Zle cislo " + n );
		}
        grid[r][c] = (n >= 1 && n <= 9) ? n : null;
      }
    }
    return grid;
  }

  function getCandidates(grid, r, c) {
    if (grid[r][c] !== null) return [];
    const forbidden = new Set();
    for (let cc = 0; cc < 9; cc++) if (grid[r][cc] !== null) forbidden.add(grid[r][cc]);
    for (let rr = 0; rr < 9; rr++) if (grid[rr][c] !== null) forbidden.add(grid[rr][c]);
    const br = Math.floor(r / 3) * 3, bc = Math.floor(c / 3) * 3;
    for (let rr = br; rr < br + 3; rr++) for (let cc = bc; cc < bc + 3; cc++) if (grid[rr][cc] !== null) forbidden.add(grid[rr][cc]);
    return [1,2,3,4,5,6,7,8,9].filter(n => !forbidden.has(n));
  }

  function applyNakedSingle() {
    const grid = getGrid();
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        if (grid[r][c] === null) {
          const cand = getCandidates(grid, r, c);
          if (cand.length === 1) {
            const cell = document.getElementById(`c-${r}-${c}`);
            cell.value = cand[0];
            cell.classList.add('hint-cell');
            setTimeout(() => cell.classList.remove('hint-cell'), 1800);
            document.getElementById('status').textContent = `Nájdený Naked Single v bunke (${r + 1}, ${c + 1}) = ${cand[0]}`;
            return true;
          }
        }
      }
    }
    document.getElementById('status').textContent = 'Žiadny Naked Single sa nenašiel.';
    return false;
  }

  function clearGrid() {
    inputs.forEach(i => i.value = '');
    document.getElementById('status').textContent = 'Mriežka bola vymazaná.';
  }

  document.getElementById('hintBtn').addEventListener('click', applyNakedSingle);
  document.getElementById('clearBtn').addEventListener('click', clearGrid);
  
  /* JSON read */
	function setGridFromArray(data) {
	  if (!Array.isArray(data) || data.length !== 9) {
		document.getElementById('status').textContent = 'Neplatný JSON: očakávam 9 riadkov.';
		return false;
	  }

	  for (let r = 0; r < 9; r++) {
		if (!Array.isArray(data[r]) || data[r].length !== 9) {
		  document.getElementById('status').textContent = `Neplatný JSON: riadok ${r + 1} nemá 9 hodnôt.`;
		  return false;
		}
		for (let c = 0; c < 9; c++) {
		  const v = data[r][c];
		  const cell = document.getElementById(`c-${r}-${c}`);
		  if (v === null || v === "" || v === 0) {
			cell.value = '';
		  } else if (Number.isInteger(v) && v >= 1 && v <= 9) {
			cell.value = String(v);
		  } else {
			document.getElementById('status').textContent = `Neplatná hodnota na pozícii (${r + 1}, ${c + 1}).`;
			return false;
		  }
		  cell.classList.remove('hint-cell');
		}
	  }

	  document.getElementById('status').textContent = 'JSON úspešne načítaný.';
	  return true;
	}

	document.getElementById('fileInput').addEventListener('change', async (e) => {
	  const file = e.target.files[0];
	  if (!file) return;

	  try {
		const text = await file.text();
		const json = JSON.parse(text);
		setGridFromArray(json);
	  } catch (err) {
		document.getElementById('status').textContent = 'Nepodarilo sa načítať JSON súbor.';
	  }

	  e.target.value = '';
	});
</script>
